version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The 1.0.x adapter rejects non-ASCII hosts. Other 1.x minor streams select Unicode backends.
      - dependency-name: idna_adapter
        update-types: ['version-update:semver-minor']
    groups:
      rust:
        patterns: ['*']
