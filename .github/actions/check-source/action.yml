name: Verify the public source archive
description: Build the allowlisted source ZIP, test its integrity and scan its extracted contents on Linux.
runs:
  using: composite
  steps:
    - name: Build and test the reviewed source ZIP
      shell: bash
      run: |
        python3 scripts/package-release.py
        python3 -m zipfile -t dist/*-source.zip
    - name: Scan extracted public source
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        curl --fail --silent --show-error --location --proto '=https' \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output gitleaks.tar.gz
        printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tar.gz | sha256sum --check
        tar -xzf gitleaks.tar.gz gitleaks
        python3 -m zipfile -e "$GITHUB_WORKSPACE"/dist/*-source.zip teams-mcp-source
        ./gitleaks dir teams-mcp-source --redact --no-banner
