name: Analysis

on:
  schedule:
    - cron: '26 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust, javascript-typescript, python]
    permissions:
      contents: read
      security-events: write
    uses: cleisson-labs/.github/.github/workflows/codeql.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      language: ${{ matrix.language }}

  rust-audit:
    uses: cleisson-labs/.github/.github/workflows/rust-audit.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0

  external-links:
    uses: cleisson-labs/.github/.github/workflows/docs.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      external: true
